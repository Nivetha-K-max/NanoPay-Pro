input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  if [level] == "ERROR" {
    mutate { add_tag => ["error"] }
  }

  if [logger_name] =~ "HealthEndpoint" {
    drop {}
  }

  mutate {
    gsub => [
      "message", "(?i)(password|secret|token|card)[=:]\s*\S+", "\1=[REDACTED]"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "nanopay-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
