# Dev profile — verbose logging, H2 not used (we run real MySQL via Docker),
# but relaxed security constraints for local development speed.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nanopay_dev}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:nanopay}
    password: ${DB_PASSWORD:nanopay_dev_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: NanoPay-HikariPool-Dev
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 300000
      connection-timeout: 20000

logging:
  level:
    com.nanopay: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE  # logs bind parameters — never in prod

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
