# Prod profile — all values come from environment variables.
# This file contains NO credentials — it only declares the structure.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=UTC&useServerPrepStmts=true&cachePrepStmts=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: NanoPay-HikariPool-Prod
      maximum-pool-size: 30
      minimum-idle: 10
      idle-timeout: 600000
      connection-timeout: 30000
      leak-detection-threshold: 60000  # alert if connection held > 60s

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.nanopay: INFO
    org.springframework.security: WARN

# Disable Swagger in production — never expose API docs publicly
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
